  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #f9f8f6; --fg: #111; --mid: #888; --nav-h: 80px; --gap: 8px; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--fg); font-family: 'Jost', sans-serif; font-weight: 300; min-height: 100vh; display: flex; flex-direction: column; }

    /* ── NAV ── */
    header {
      position: sticky; top: 0; z-index: 100; background: var(--bg);
      height: var(--nav-h); display: flex; align-items: center;
      justify-content: space-between; padding: 0 40px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    .logo { display: flex; align-items: center; }
    .logo img { height: 64px; width: auto; max-width: 160px; object-fit: contain; display: block; }
    nav { display: flex; gap: 36px; }
    nav a { font-family: 'Jost', sans-serif; font-weight: 300; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; color: var(--mid); transition: color 0.2s; }
    nav a:hover, nav a.active { color: var(--fg); }
    .social { display: flex; align-items: center; gap: 16px; }
    .social a { display: flex; align-items: center; color: var(--mid); transition: color 0.2s; }
    .social a:hover { color: var(--fg); }
    .social svg { width: 18px; height: 18px; fill: currentColor; }

    /* ── MAIN ── */
    main { flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; padding: 0 40px 80px; }

    /* ── GRID ──
       Two equal columns, rows auto-size to content.
       align-items: start means items don't stretch to fill the row height.
       This gives the Wix editorial masonry feel — portrait images appear
       tall, landscape short, no forced aspect ratios.
    ── */
    .work-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--gap);
      align-items: start;
    }

    /* Full-width row */
    .grid-item.full { grid-column: 1 / -1; }

    /* Asymmetric pairs — use .wide (60%) and .narrow (40%) on siblings */
    .work-grid.asym-row {
      grid-template-columns: 3fr 2fr;
    }

    /* ── GRID ITEM ── */
    .grid-item {
      position: relative; overflow: hidden;
      background: #111; cursor: pointer;
      display: block;
      animation: fadeUp 0.5s ease both; opacity: 0;
    }
    .grid-item:nth-child(1)  { animation-delay: 0.03s; }
    .grid-item:nth-child(2)  { animation-delay: 0.06s; }
    .grid-item:nth-child(3)  { animation-delay: 0.09s; }
    .grid-item:nth-child(4)  { animation-delay: 0.12s; }
    .grid-item:nth-child(5)  { animation-delay: 0.15s; }
    .grid-item:nth-child(6)  { animation-delay: 0.18s; }
    .grid-item:nth-child(7)  { animation-delay: 0.21s; }
    .grid-item:nth-child(8)  { animation-delay: 0.24s; }
    .grid-item:nth-child(9)  { animation-delay: 0.27s; }
    .grid-item:nth-child(n+10) { animation-delay: 0.30s; }

    /* ── IMAGE — natural aspect ratio, no cropping ── */
    .grid-item img.thumb {
      display: block;
      width: 100%;
      height: auto;          /* Key: natural aspect ratio, not forced 16:9 */
      transition: transform 0.55s cubic-bezier(0.25,0.46,0.45,0.94),
                  opacity 0.3s ease;
      opacity: 0;
    }
    .grid-item img.thumb.loaded { opacity: 1; }
    .grid-item:hover img.thumb { transform: scale(1.03); }

    /* Hover overlay */
    .hover-layer {
      position: absolute; inset: 0; z-index: 2;
      background: rgba(0,0,0,0); transition: background 0.3s ease;
    }
    .grid-item:hover .hover-layer { background: rgba(0,0,0,0.18); }

    /* Play icon (videos only) */
    .play-icon {
      position: absolute; inset: 0; z-index: 3;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.25s ease;
    }
    .grid-item:hover .play-icon { opacity: 1; }
    .play-icon svg { width: 56px; height: 56px; fill: rgba(255,255,255,0.9); filter: drop-shadow(0 2px 12px rgba(0,0,0,0.5)); transition: transform 0.2s; }
    .grid-item:hover .play-icon svg { transform: scale(1.1); }

    /* Gallery badge */
    .gallery-count {
      position: absolute; bottom: 12px; right: 14px; z-index: 3;
      background: rgba(0,0,0,0.55); color: #fff;
      font-size: 11px; letter-spacing: 0.08em; padding: 3px 8px; border-radius: 2px;
      opacity: 0; transition: opacity 0.25s ease; backdrop-filter: blur(4px);
    }
    .grid-item:hover .gallery-count { opacity: 1; }

    /* ── LIGHTBOX ── */
    #lightbox {
      position: fixed; inset: 0; z-index: 999;
      background: rgba(0,0,0,0);
      display: flex; align-items: center; justify-content: center;
      padding: 40px; pointer-events: none;
      transition: background 0.3s ease;
    }
    #lightbox.open { background: rgba(0,0,0,0.92); pointer-events: all; }

    .lb-inner {
      position: relative; width: 100%; max-width: 1000px;
      transform: scale(0.94) translateY(18px); opacity: 0;
      transition: transform 0.35s cubic-bezier(0.34,1.4,0.64,1), opacity 0.28s ease;
    }
    #lightbox.open .lb-inner { transform: scale(1) translateY(0); opacity: 1; }

    #lb-close {
      position: absolute; top: -44px; right: 0;
      background: none; border: none; color: #fff;
      font-size: 26px; cursor: pointer;
      opacity: 0.6; transition: opacity 0.2s, transform 0.2s; padding: 4px 8px;
    }
    #lb-close:hover { opacity: 1; transform: rotate(90deg); }

    #lb-video-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; display: none; }
    #lb-iframe { width: 100%; height: 100%; border: none; display: block; }

    #lb-image-wrap { position: relative; width: 100%; display: none; align-items: center; justify-content: center; }
    #lb-img { max-width: 100%; max-height: 84vh; display: block; object-fit: contain; margin: 0 auto; }

    .lb-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.1); border: none; cursor: pointer;
      color: #fff; font-size: 22px; width: 48px; height: 48px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s; backdrop-filter: blur(4px); border-radius: 2px;
    }
    .lb-nav:hover { background: rgba(255,255,255,0.22); }
    #lb-prev { left: -60px; }
    #lb-next { right: -60px; }
    .lb-nav.hidden { display: none; }
    #lb-counter { position: absolute; bottom: -32px; left: 50%; transform: translateX(-50%); font-size: 12px; letter-spacing: 0.1em; color: rgba(255,255,255,0.45); }

    /* ── FOOTER ── */
    footer { border-top: 1px solid rgba(0,0,0,0.08); padding: 24px 40px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    footer a { font-size: 12px; letter-spacing: 0.06em; color: var(--mid); text-decoration: none; transition: color 0.2s; }
    footer a:hover { color: var(--fg); }
    footer p { font-size: 11px; letter-spacing: 0.06em; color: #bbb; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 680px) {
      header { padding: 0 20px; }
      .logo img { height: 48px; }
      nav { gap: 20px; }
      main { padding: 0 16px 60px; }
      footer { padding: 20px; }
      .work-grid { grid-template-columns: 1fr; }
      .grid-item.full { grid-column: span 1; }
      #lightbox { padding: 16px; }
      #lb-prev { left: 4px; } #lb-next { right: 4px; }
    }
  </style>

<script>
// Image fade-in on load
document.querySelectorAll('img.thumb').forEach(img => {
  if (img.complete) { img.classList.add('loaded'); }
  else { img.addEventListener('load', () => img.classList.add('loaded')); }
  // YouTube fallback
  if (img.src.includes('maxresdefault')) {
    img.addEventListener('error', function() {
      if (!this.dataset.fb) {
        this.dataset.fb = '1';
        this.src = this.src.replace('maxresdefault', 'hqdefault');
      }
    });
  }
});

// Lightbox
const lightbox    = document.getElementById('lightbox');
const lbClose     = document.getElementById('lb-close');
const lbVideoWrap = document.getElementById('lb-video-wrap');
const lbIframe    = document.getElementById('lb-iframe');
const lbImageWrap = document.getElementById('lb-image-wrap');
const lbImg       = document.getElementById('lb-img');
const lbPrev      = document.getElementById('lb-prev');
const lbNext      = document.getElementById('lb-next');
const lbCounter   = document.getElementById('lb-counter');

let gallery = [], gIdx = 0;

function driveFullsize(id) { return `https://lh3.googleusercontent.com/d/${id}=w1600`; }

function openVideo(ytId) {
  lbVideoWrap.style.display = 'block';
  lbImageWrap.style.display = 'none';
  lbIframe.src = `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0`;
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function openGallery(images, idx) {
  gallery = images.map(id => driveFullsize(id));
  gIdx = idx || 0;
  lbVideoWrap.style.display = 'none';
  lbImageWrap.style.display = 'flex';
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
  showImg();
}

function showImg() {
  lbImg.src = gallery[gIdx];
  const t = gallery.length;
  lbCounter.textContent = t > 1 ? `${gIdx+1} / ${t}` : '';
  lbPrev.classList.toggle('hidden', t <= 1);
  lbNext.classList.toggle('hidden', t <= 1);
}

function closeLightbox() {
  lightbox.classList.remove('open');
  setTimeout(() => { lbIframe.src=''; lbImg.src=''; lbVideoWrap.style.display='none'; lbImageWrap.style.display='none'; }, 300);
  document.body.style.overflow = '';
}

document.querySelectorAll('.grid-item').forEach(item => {
  item.addEventListener('click', () => {
    if (item.dataset.type === 'video') {
      openVideo(item.dataset.ytId);
    } else {
      openGallery(JSON.parse(item.dataset.images), 0);
    }
  });
});

lbPrev.addEventListener('click', e => { e.stopPropagation(); gIdx = (gIdx-1+gallery.length)%gallery.length; showImg(); });
lbNext.addEventListener('click', e => { e.stopPropagation(); gIdx = (gIdx+1)%gallery.length; showImg(); });
lbClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft')  { gIdx=(gIdx-1+gallery.length)%gallery.length; showImg(); }
  if (e.key === 'ArrowRight') { gIdx=(gIdx+1)%gallery.length; showImg(); }
});
</script>
</body>
</html>
