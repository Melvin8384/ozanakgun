  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #cfd9ea;        /* light periwinkle blue — matches Wix */
      --fg: #1a2d5a;        /* dark navy */
      --mid: #6a7a9a;
      --gap: 5px;
    }

    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--fg); font-family: 'Jost', sans-serif; font-weight: 300; min-height: 100vh; display: flex; flex-direction: column; }

    /* ── HEADER ── */
    header {
      background: var(--bg);
      padding: 24px 48px 20px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }

    /* Logo — large, top-left */
    .logo { display: flex; align-items: flex-start; flex-shrink: 0; }
    .logo img {
      height: 120px;
      width: auto;
      max-width: 220px;
      object-fit: contain;
      display: block;
    }

    /* Nav + social — top right */
    .header-right {
      display: flex;
      align-items: center;
      gap: 40px;
      padding-top: 8px;
    }

    nav { display: flex; gap: 28px; }
    nav a {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 14px;
      letter-spacing: 0.04em;
      text-decoration: none;
      color: var(--mid);
      transition: color 0.2s;
    }
    nav a:hover, nav a.active { color: var(--fg); }

    .social { display: flex; align-items: center; gap: 14px; }
    .social a { display: flex; align-items: center; color: var(--mid); transition: color 0.2s; }
    .social a:hover { color: var(--fg); }
    .social svg { width: 17px; height: 17px; fill: currentColor; }

    /* ── MAIN ── */
    main { flex: 1; padding: 0 var(--gap) 60px; }

    /* ── 3-COLUMN GRID ── */
    .work-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--gap);
      align-items: start;
      margin-bottom: var(--gap);
    }

    /* span helpers */
    .col-2 { grid-column: span 2; }
    .col-3 { grid-column: span 3; }

    /* ── GRID ITEM ── */
    .grid-item {
      position: relative;
      overflow: hidden;
      background: #1a2035;
      cursor: pointer;
      display: block;
      animation: fadeUp 0.45s ease both;
      opacity: 0;
    }
    .grid-item:nth-child(1) { animation-delay: 0.03s; }
    .grid-item:nth-child(2) { animation-delay: 0.06s; }
    .grid-item:nth-child(3) { animation-delay: 0.09s; }
    .grid-item:nth-child(n+4) { animation-delay: 0.12s; }

    /* Natural aspect ratio — images dictate height */
    .grid-item img.thumb {
      display: block;
      width: 100%;
      height: auto;
      transition: transform 0.55s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.3s ease;
      opacity: 0;
    }
    .grid-item img.thumb.loaded { opacity: 1; }
    .grid-item:hover img.thumb { transform: scale(1.03); }

    /* Hover overlay */
    .hover-layer {
      position: absolute; inset: 0; z-index: 2;
      background: rgba(0,0,0,0); transition: background 0.3s ease;
    }
    .grid-item:hover .hover-layer { background: rgba(0,0,0,0.15); }

    /* Circular play button — matches Wix style */
    .play-icon {
      position: absolute; inset: 0; z-index: 3;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.25s ease;
    }
    .grid-item:hover .play-icon { opacity: 1; }
    .play-btn {
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(255,255,255,0.82);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s ease, background 0.2s ease;
      box-shadow: 0 2px 16px rgba(0,0,0,0.25);
    }
    .play-btn svg { width: 20px; height: 20px; fill: var(--fg); margin-left: 3px; }
    .grid-item:hover .play-btn { transform: scale(1.1); background: rgba(255,255,255,0.95); }

    /* Gallery badge */
    .gallery-count {
      position: absolute; bottom: 10px; right: 12px; z-index: 3;
      background: rgba(0,0,0,0.5); color: #fff;
      font-size: 11px; letter-spacing: 0.07em; padding: 2px 7px; border-radius: 2px;
      opacity: 0; transition: opacity 0.25s ease; backdrop-filter: blur(4px);
    }
    .grid-item:hover .gallery-count { opacity: 1; }

    /* ── LIGHTBOX ── */
    #lightbox {
      position: fixed; inset: 0; z-index: 999;
      background: rgba(0,0,0,0);
      display: flex; align-items: center; justify-content: center;
      padding: 40px; pointer-events: none;
      transition: background 0.3s ease;
    }
    #lightbox.open { background: rgba(0,0,0,0.92); pointer-events: all; }

    .lb-inner {
      position: relative; width: 100%; max-width: 1000px;
      transform: scale(0.94) translateY(18px); opacity: 0;
      transition: transform 0.35s cubic-bezier(0.34,1.4,0.64,1), opacity 0.28s ease;
    }
    #lightbox.open .lb-inner { transform: scale(1) translateY(0); opacity: 1; }

    #lb-close {
      position: absolute; top: -44px; right: 0;
      background: none; border: none; color: #fff;
      font-size: 26px; cursor: pointer;
      opacity: 0.6; transition: opacity 0.2s, transform 0.2s; padding: 4px 8px;
    }
    #lb-close:hover { opacity: 1; transform: rotate(90deg); }

    #lb-video-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; display: none; }
    #lb-iframe { width: 100%; height: 100%; border: none; display: block; }

    #lb-image-wrap { position: relative; width: 100%; display: none; align-items: center; justify-content: center; }
    #lb-img { max-width: 100%; max-height: 84vh; display: block; object-fit: contain; margin: 0 auto; }

    .lb-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.1); border: none; cursor: pointer;
      color: #fff; font-size: 22px; width: 48px; height: 48px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s; backdrop-filter: blur(4px); border-radius: 2px;
    }
    .lb-nav:hover { background: rgba(255,255,255,0.22); }
    #lb-prev { left: -60px; } #lb-next { right: -60px; }
    .lb-nav.hidden { display: none; }
    #lb-counter { position: absolute; bottom: -32px; left: 50%; transform: translateX(-50%); font-size: 12px; letter-spacing: 0.1em; color: rgba(255,255,255,0.45); }

    /* ── FOOTER ── */
    footer { padding: 24px 48px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    footer a { font-size: 12px; letter-spacing: 0.06em; color: var(--mid); text-decoration: none; transition: color 0.2s; }
    footer a:hover { color: var(--fg); }
    footer p { font-size: 11px; letter-spacing: 0.06em; color: var(--mid); opacity: 0.7; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .work-grid { grid-template-columns: repeat(2, 1fr); }
      .col-3 { grid-column: span 2; }
    }
    @media (max-width: 600px) {
      header { padding: 16px 20px; flex-direction: column; gap: 16px; }
      .logo img { height: 80px; }
      .header-right { gap: 20px; }
      nav { gap: 16px; }
      main { padding: 0 4px 40px; }
      footer { padding: 20px; }
      .work-grid { grid-template-columns: 1fr; }
      .col-2, .col-3 { grid-column: span 1; }
      #lightbox { padding: 16px; }
      #lb-prev { left: 4px; } #lb-next { right: 4px; }
    }
  </style>

<!-- LIGHTBOX -->
<div id="lightbox" role="dialog" aria-modal="true">
  <div class="lb-inner">
    <button id="lb-close" aria-label="Close">✕</button>
    <div id="lb-video-wrap"><iframe id="lb-iframe" allowfullscreen allow="autoplay; encrypted-media"></iframe></div>
    <div id="lb-image-wrap">
      <button class="lb-nav hidden" id="lb-prev">&#8592;</button>
      <img id="lb-img" src="" alt="">
      <button class="lb-nav hidden" id="lb-next">&#8594;</button>
      <div id="lb-counter"></div>
    </div>
  </div>
</div>

<script>
// Image fade-in + YouTube fallback
document.querySelectorAll('img.thumb').forEach(img => {
  if (img.complete) img.classList.add('loaded');
  else img.addEventListener('load', () => img.classList.add('loaded'));
  if (img.src.includes('maxresdefault')) {
    img.addEventListener('error', function() {
      if (!this.dataset.fb) { this.dataset.fb='1'; this.src = this.src.replace('maxresdefault','hqdefault'); }
    });
  }
});

// Lightbox
const lightbox=document.getElementById('lightbox'),lbClose=document.getElementById('lb-close'),
  lbVW=document.getElementById('lb-video-wrap'),lbIframe=document.getElementById('lb-iframe'),
  lbIW=document.getElementById('lb-image-wrap'),lbImg=document.getElementById('lb-img'),
  lbPrev=document.getElementById('lb-prev'),lbNext=document.getElementById('lb-next'),
  lbCounter=document.getElementById('lb-counter');
let gallery=[],gIdx=0;
function driveFS(id){return`https://lh3.googleusercontent.com/d/${id}=w1600`;}
function openVideo(id){lbVW.style.display='block';lbIW.style.display='none';lbIframe.src=`https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;lightbox.classList.add('open');document.body.style.overflow='hidden';}
function openGallery(imgs,i){gallery=imgs.map(id=>driveFS(id));gIdx=i||0;lbVW.style.display='none';lbIW.style.display='flex';lightbox.classList.add('open');document.body.style.overflow='hidden';showImg();}
function showImg(){lbImg.src=gallery[gIdx];const t=gallery.length;lbCounter.textContent=t>1?`${gIdx+1} / ${t}`:'';lbPrev.classList.toggle('hidden',t<=1);lbNext.classList.toggle('hidden',t<=1);}
function closeLB(){lightbox.classList.remove('open');setTimeout(()=>{lbIframe.src='';lbImg.src='';lbVW.style.display='none';lbIW.style.display='none';},300);document.body.style.overflow='';}
document.querySelectorAll('.grid-item').forEach(item=>{
  item.addEventListener('click',()=>{
    if(item.dataset.type==='video') openVideo(item.dataset.ytId);
    else openGallery(JSON.parse(item.dataset.images),0);
  });
});
lbPrev.addEventListener('click',e=>{e.stopPropagation();gIdx=(gIdx-1+gallery.length)%gallery.length;showImg();});
lbNext.addEventListener('click',e=>{e.stopPropagation();gIdx=(gIdx+1)%gallery.length;showImg();});
lbClose.addEventListener('click',closeLB);
lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeLB();});
document.addEventListener('keydown',e=>{if(!lightbox.classList.contains('open'))return;if(e.key==='Escape')closeLB();if(e.key==='ArrowLeft'){gIdx=(gIdx-1+gallery.length)%gallery.length;showImg();}if(e.key==='ArrowRight'){gIdx=(gIdx+1)%gallery.length;showImg();}});
</script>
