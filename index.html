<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#cdd6e8;--fg:#1a2d5a;--mid:#6a7a9a;--gap:3px}
    body{background:var(--bg);color:var(--fg);font-family:'Jost',sans-serif;font-weight:300;min-height:100vh;display:flex;flex-direction:column}

    /* HEADER */
    header{background:var(--bg);padding:28px 50px 40px;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .logo img{height:130px;width:auto;display:block;object-fit:contain}
    .header-right{display:flex;align-items:center;gap:36px}
    nav{display:flex;gap:28px}
    nav a{font-size:14px;letter-spacing:.04em;text-decoration:none;color:var(--mid);transition:color .2s}
    nav a:hover,nav a.active{color:var(--fg)}
    .social{display:flex;align-items:center;gap:14px}
    .social a{display:flex;align-items:center;color:var(--mid);transition:color .2s}
    .social a:hover{color:var(--fg)}
    .social svg{width:17px;height:17px;fill:currentColor}

    /* MAIN */
    main{flex:1;display:flex;flex-direction:column;gap:var(--gap)}

    /* GRID BLOCKS
       .g3  = 3 equal columns
       .g2  = 2 equal columns
       .gc  = complex: 3 cols where first item spans 2 cols + 2 rows
    */
    .g3,.g2,.gc{display:grid;gap:var(--gap)}
    .g3{grid-template-columns:repeat(3,1fr)}
    .g2{grid-template-columns:repeat(2,1fr)}
    .gc{grid-template-columns:repeat(3,1fr)}
    .gc .big{grid-column:span 2;grid-row:span 2}

    /* GRID ITEM */
    .grid-item{
      position:relative;overflow:hidden;
      background:#0f1520;cursor:pointer;
      aspect-ratio:16/9;
    }
    .grid-item img.thumb{
      position:absolute;inset:0;width:100%;height:100%;
      object-fit:cover;display:block;
      transition:transform .55s cubic-bezier(.25,.46,.45,.94),opacity .3s;
      opacity:0
    }
    .grid-item img.thumb.loaded{opacity:1}
    .grid-item:hover img.thumb{transform:scale(1.04)}
    .hover-layer{position:absolute;inset:0;z-index:2;background:rgba(0,0,0,0);transition:background .3s}
    .grid-item:hover .hover-layer{background:rgba(0,0,0,.18)}
    .play-icon{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s}
    .grid-item:hover .play-icon{opacity:1}
    .play-btn{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 16px rgba(0,0,0,.3);transition:transform .2s,background .2s}
    .play-btn svg{width:20px;height:20px;fill:var(--fg);margin-left:3px}
    .grid-item:hover .play-btn{transform:scale(1.1);background:rgba(255,255,255,.96)}
    .gallery-count{position:absolute;bottom:10px;right:12px;z-index:3;background:rgba(0,0,0,.5);color:#fff;font-size:11px;letter-spacing:.07em;padding:2px 7px;border-radius:2px;opacity:0;transition:opacity .25s;backdrop-filter:blur(4px)}
    .grid-item:hover .gallery-count{opacity:1}

    /* LIGHTBOX */
    #lightbox{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;padding:40px;pointer-events:none;transition:background .3s}
    #lightbox.open{background:rgba(0,0,0,.92);pointer-events:all}
    .lb-inner{position:relative;width:100%;max-width:960px;transform:scale(.94) translateY(18px);opacity:0;transition:transform .35s cubic-bezier(.34,1.4,.64,1),opacity .28s}
    #lightbox.open .lb-inner{transform:scale(1) translateY(0);opacity:1}
    #lb-close{position:absolute;top:-44px;right:0;background:none;border:none;color:#fff;font-size:26px;cursor:pointer;opacity:.6;transition:opacity .2s,transform .2s;padding:4px 8px}
    #lb-close:hover{opacity:1;transform:rotate(90deg)}
    #lb-video-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;display:none}
    #lb-iframe{width:100%;height:100%;border:none;display:block}
    #lb-image-wrap{position:relative;width:100%;display:none;align-items:center;justify-content:center}
    #lb-img{max-width:100%;max-height:84vh;display:block;object-fit:contain;margin:0 auto}
    .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);border:none;cursor:pointer;color:#fff;font-size:22px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;transition:background .2s;backdrop-filter:blur(4px);border-radius:2px}
    .lb-nav:hover{background:rgba(255,255,255,.22)}
    #lb-prev{left:-60px}#lb-next{right:-60px}
    .lb-nav.hidden{display:none}
    #lb-counter{position:absolute;bottom:-32px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.1em;color:rgba(255,255,255,.45)}

    /* FOOTER */
    footer{padding:24px 50px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
    footer a{font-size:12px;letter-spacing:.06em;color:var(--mid);text-decoration:none;transition:color .2s}
    footer a:hover{color:var(--fg)}
    footer p{font-size:11px;letter-spacing:.06em;color:var(--mid);opacity:.7}

    @media(max-width:900px){
      .g3{grid-template-columns:repeat(2,1fr)}
      .gc{grid-template-columns:repeat(2,1fr)}
      .gc .big{grid-column:span 2;grid-row:span 1}
    }
    @media(max-width:600px){
      header{padding:16px 20px 28px;flex-direction:column;align-items:flex-start;gap:16px}
      .logo img{height:80px}
      .header-right{gap:20px}
      nav{gap:16px}
      .g3,.g2,.gc{grid-template-columns:1fr}
      .gc .big{grid-column:span 1;grid-row:span 1}
      footer{padding:20px}
      #lightbox{padding:16px}
      #lb-prev{left:4px}#lb-next{right:4px}
    }
  </style>
</head>

<script>
// ── DATA ─────────────────────────────────────────────────────────
const V = id => ({type:'video', ytId:id});
const S = (thumb, images) => ({type:'still', thumb, images: images||[thumb]});

const ITEMS = [
  // 44 VIDEOS
  V('yTTb3HzEKfE'), V('HcKzLBL1bxU'), V('gOkGUcLen9c'), V('EcsZ6ASNGY8'),
  V('stP6tCib2mA'), V('tj_4UBnejnE'), V('1ZfV8ev8nSE'), V('I_Y76ct_S7c'),

  V('UGkM3-CCOh8'), V('H1WM8WmG4ZY'), V('gpDz3yMQPG0'), V('MTepAWOnnwM'),

  // 20 STILLS
  S('1syYLSPAYGcrBcCWwTAoyKx9OcCmc1inW'),
  S('1xSHnpQWC4K-FWi2fCBCsMrV5MMATN_Zl',['1xSHnpQWC4K-FWi2fCBCsMrV5MMATN_Zl','11v919KtjimjhQUmFKm7rsTs4TawYftq7','1I1cIJP8u0GrPAjMqGB3dS0qDnrDmYDzX','1-O9cxYHdIhSLLSytlEYV78WZTNlB-Xc6','1TRmGzWONhPibK1YhPAT1nrGPJQiLShkI','1BdBgcZp4-gGvcJSACWttHudjRIqUv0Sj','1GN6dqihhmnLRh97dI5TgGwf8mevHZhKK']),
  S('1vQRaFQ5p2VoP0NpyIV4Z7LfcVdU1IV62',['1vQRaFQ5p2VoP0NpyIV4Z7LfcVdU1IV62','1WPuBnfo3KCBekLanM9xAfBgsBQOoJwhV','1kU692rC_21v1rv5e7Pm7aaOKa91fvK3t','1jn_lAYZC4zI031ZH9aXW1LqS8FQ8NK_T','1amWr4PA-Y9AFcE1nxzVz8G8Uc-15fLN0','1mNCne3sc6N2kXcgoquPa0KHLiOH_tGfD']),
  S('1YpT7XSyvecdXyitQar8I4ViJ1amYmq0t',['1YpT7XSyvecdXyitQar8I4ViJ1amYmq0t','1GhJvkngbzvQ7V2VLmy-xPuAIvysoqn7u']),
  S('116ASjzBDhv-pXp-NpzNV5jOQaRVH63xz'),

  S('1GP3krUEtJfTQFzilh4vDxrGD6BJIwibY',['1GP3krUEtJfTQFzilh4vDxrGD6BJIwibY','1SMdVq5qfEDXN1vg4LeBxTr8E-VcTYQGR']),
  S('1XWijeyYGC8nYdAwRsJrvZnyAXSN_D10g'),
  S('1fFoGKOVjGBwoGUbwI4C8LGbamdIOu6Gw',['1fFoGKOVjGBwoGUbwI4C8LGbamdIOu6Gw','1Z_-_I3HbHdgkqyG-CGBUm-pFPXLwP2ht','13_HnHNzdxnqbklYAohJtV4nJt-x_mKCI']),
  S('1pGM_lk-7qcQa-Tp_sr5qMNBUWv4zT_9p'),

  S('1PkeYeJK_pPCmMCXR2ah-6i18gyKPwMr0',['1PkeYeJK_pPCmMCXR2ah-6i18gyKPwMr0','1WsVNcjRQfa4EAGpq-Ewd5Tqz11Kd907I','1Fysrpyf8BBbByCRDY7cqb2cojj-QAO03']),
  S('1hkCFNXWf0XP-DEWDLvtxTkpk0T5Y8OZv',['1hkCFNXWf0XP-DEWDLvtxTkpk0T5Y8OZv','1203bJf2tLVCbgFQiB445UfUr6qo52MWW']),
  S('1kGyhqscmZATb9AMA4VSHMRMOLgZ3vbv-',['1kGyhqscmZATb9AMA4VSHMRMOLgZ3vbv-','1zDG7eBAvQ8ZkETTx8KOsoCYvatBfm-PN']),
  S('1p0-KMoiHq7eItHPth4xzozFjDxXaAyMp'),
  S('11Yg7AftHF6Qx4-BChEJ1ygSOmdOnuxjL',['11Yg7AftHF6Qx4-BChEJ1ygSOmdOnuxjL','1V8chxVpMbxmG7iHjrwgxUq8LJeBTlpIb']),
  S('1Ivzu_NiXF8A96rzjwB1elWph7o_4wJ5w'),
  S('194xsd6vb0hu4H7sCiI-fja-t6tkuvkSG'),
];

// ── LAYOUT PLAN ─────────────────────────────────────────────────
// g3 = 3 equal cols  |  gc = complex (first item spans 2col×2row)  |  g2 = 2 equal cols
const LAYOUT = [
  'g3','gc','g3','g3','gc','g3','g3','gc',
  'g3','g3','gc','g3','g3','gc','g3','g3',
  'gc','g2','g3',
];

// ── BUILD GRID ──────────────────────────────────────────────────
function ytThumb(id){ return `https://img.youtube.com/vi/${id}/maxresdefault.jpg`; }
function driveThumb(id){ return `https://lh3.googleusercontent.com/d/${id}=w800`; }
function driveFS(id){ return `https://lh3.googleusercontent.com/d/${id}=w1600`; }

function makeItem(item, isBig){
  const div = document.createElement('div');
  div.className = 'grid-item' + (isBig ? ' big' : '');

  if(item.type === 'video'){
    const img = document.createElement('img');
    img.className = 'thumb';
    img.loading = 'lazy';
    img.src = ytThumb(item.ytId);
    img.onerror = function(){
      const fb = +this.dataset.fb||0;
      const chain = ['sddefault','hqdefault','mqdefault'];
      if(fb < chain.length){
        this.src = `https://img.youtube.com/vi/${item.ytId}/${chain[fb]}.jpg`;
        this.dataset.fb = fb+1;
      }
    };
    div.appendChild(img);
    div.insertAdjacentHTML('beforeend','<div class="hover-layer"></div><div class="play-icon"><div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>');
    div.dataset.type = 'video';
    div.dataset.ytId = item.ytId;
  } else {
    const img = document.createElement('img');
    img.className = 'thumb';
    img.loading = 'lazy';
    img.src = driveThumb(item.thumb);
    const n = item.images.length;
    div.appendChild(img);
    div.insertAdjacentHTML('beforeend',`<div class="hover-layer"></div>${n>1?`<div class="gallery-count">${n} images</div>`:''}`);
    div.dataset.type = 'still';
    div.dataset.images = JSON.stringify(item.images);
  }
  return div;
}

const main = document.getElementById('main');
let itemIdx = 0;

for(const blockType of LAYOUT){
  if(itemIdx >= ITEMS.length) break;

  const block = document.createElement('div');
  block.className = blockType;

  if(blockType === 'gc'){
    // complex: big (2col×2row) + 2 stacked
    if(itemIdx+2 < ITEMS.length){
      block.appendChild(makeItem(ITEMS[itemIdx++], true));  // big
      block.appendChild(makeItem(ITEMS[itemIdx++], false)); // right top
      block.appendChild(makeItem(ITEMS[itemIdx++], false)); // right bottom
    }
  } else if(blockType === 'g2'){
    block.appendChild(makeItem(ITEMS[itemIdx++], false));
    if(itemIdx < ITEMS.length) block.appendChild(makeItem(ITEMS[itemIdx++], false));
  } else {
    // g3: 3 items
    for(let i=0; i<3 && itemIdx < ITEMS.length; i++){
      block.appendChild(makeItem(ITEMS[itemIdx++], false));
    }
  }
  main.appendChild(block);
}

// Fade in on load
document.querySelectorAll('img.thumb').forEach(img => {
  if(img.complete) img.classList.add('loaded');
  else img.addEventListener('load', () => img.classList.add('loaded'));
});

// ── LIGHTBOX ────────────────────────────────────────────────────
const lb=document.getElementById('lightbox'),
  lbClose=document.getElementById('lb-close'),
  lbVW=document.getElementById('lb-video-wrap'),
  lbIF=document.getElementById('lb-iframe'),
  lbIW=document.getElementById('lb-image-wrap'),
  lbImg=document.getElementById('lb-img'),
  lbPrev=document.getElementById('lb-prev'),
  lbNext=document.getElementById('lb-next'),
  lbCtr=document.getElementById('lb-counter');
let gallery=[],gIdx=0;

function openVideo(id){lbVW.style.display='block';lbIW.style.display='none';lbIF.src=`https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;lb.classList.add('open');document.body.style.overflow='hidden';}
function openGallery(imgs,i){gallery=imgs.map(driveFS);gIdx=i||0;lbVW.style.display='none';lbIW.style.display='flex';lb.classList.add('open');document.body.style.overflow='hidden';showImg();}
function showImg(){lbImg.src=gallery[gIdx];const t=gallery.length;lbCtr.textContent=t>1?`${gIdx+1} / ${t}`:'';lbPrev.classList.toggle('hidden',t<=1);lbNext.classList.toggle('hidden',t<=1);}
function closeLB(){lb.classList.remove('open');setTimeout(()=>{lbIF.src='';lbImg.src='';lbVW.style.display='none';lbIW.style.display='none';},300);document.body.style.overflow='';}

document.addEventListener('click',e=>{
  const item=e.target.closest('.grid-item');
  if(item){
    if(item.dataset.type==='video') openVideo(item.dataset.ytId);
    else openGallery(JSON.parse(item.dataset.images),0);
  }
});
lbPrev.addEventListener('click',e=>{e.stopPropagation();gIdx=(gIdx-1+gallery.length)%gallery.length;showImg();});
lbNext.addEventListener('click',e=>{e.stopPropagation();gIdx=(gIdx+1)%gallery.length;showImg();});
lbClose.addEventListener('click',closeLB);
lb.addEventListener('click',e=>{if(e.target===lb)closeLB();});
document.addEventListener('keydown',e=>{
  if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')closeLB();
  if(e.key==='ArrowLeft'){gIdx=(gIdx-1+gallery.length)%gallery.length;showImg();}
  if(e.key==='ArrowRight'){gIdx=(gIdx+1)%gallery.length;showImg();}
});
</script>
