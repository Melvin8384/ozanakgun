  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #cfd9ea;
      --fg: #1a2d5a;
      --mid: #6a7a9a;
      --nav-h: unset;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg);
      padding: 24px 48px 20px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }

    .logo img {
      height: 120px;
      width: auto;
      max-width: 220px;
      object-fit: contain;
      display: block;
    }

    nav {
      display: flex;
      gap: 36px;
    }

    nav a {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--mid);
      transition: color 0.2s;
    }

    nav a:hover, nav a.active { color: var(--fg); }

    .social {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .social a {
      display: flex;
      align-items: center;
      color: var(--mid);
      transition: color 0.2s;
    }

    .social a:hover { color: var(--fg); }

    .social svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* ── PRESS ── */
    main {
      flex: 1;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      padding: 60px 40px 100px;
    }

    .press-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .press-item {
      display: block;
      overflow: hidden;
      background: #e8e6e2;
      position: relative;
      animation: fadeUp 0.5s ease both;
    }

    .press-item:nth-child(1) { animation-delay: 0.05s; grid-column: span 1; }
    .press-item:nth-child(2) { animation-delay: 0.15s; grid-column: span 1; }
    .press-item:nth-child(3) { animation-delay: 0.25s; grid-column: span 2; }

    .press-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                  opacity 0.3s ease;
      opacity: 0;
    }

    .press-item img.loaded { opacity: 1; }
    .press-item:hover img { transform: scale(1.02); }

    .press-item .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0);
      transition: background 0.3s ease;
      display: flex;
      align-items: flex-end;
      padding: 20px;
    }

    .press-item:hover .overlay {
      background: rgba(0,0,0,0.12);
    }

    .press-item .arrow {
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      font-size: 20px;
      color: #fff;
      line-height: 1;
    }

    .press-item:hover .arrow {
      opacity: 1;
      transform: translateY(0);
    }

    /* aspect ratios */
    .press-item { aspect-ratio: 3 / 2; }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid rgba(0,0,0,0.08);
      padding: 24px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    footer a {
      font-size: 12px;
      letter-spacing: 0.06em;
      color: var(--mid);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover { color: var(--fg); }

    footer p {
      font-size: 11px;
      letter-spacing: 0.06em;
      color: #bbb;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 680px) {
      header { padding: 0 20px; }
      nav { gap: 20px; }
      main { padding: 40px 20px 60px; }
      footer { padding: 20px; }
      .press-grid { grid-template-columns: 1fr; }
      .press-item:nth-child(1),
      .press-item:nth-child(2),
      .press-item:nth-child(3) { grid-column: span 1; }
    }
  </style>
